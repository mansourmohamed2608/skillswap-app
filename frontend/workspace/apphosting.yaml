runtime: nodejs20

env:
  - variable: NEXT_PUBLIC_FUNCTIONS_BASE
    value: "https://europe-west3-skillswap-69yxi.cloudfunctions.net"
    availability: [BUILD, RUNTIME]

  - variable: NEXT_PUBLIC_API_BASE
    value: "https://europe-west3-skillswap-69yxi.cloudfunctions.net/api"
    availability: [BUILD, RUNTIME]

  - variable: MATCHMAKING_MODE
    value: "auto"
    availability: [BUILD, RUNTIME]

  - variable: GEMINI_API_KEY
    secret: GEMINI_API_KEY
    availability: [RUNTIME]
